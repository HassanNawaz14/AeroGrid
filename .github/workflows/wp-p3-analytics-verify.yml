name: WP-P3-02/03 analytics evidence (read-only)

# Runs the committed Phase 3 SQL against the shared warehouse through the
# aerogrid_reader role and uploads the generated Markdown evidence. This is a
# manual verification harness, not a scheduled refresh.

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "SQL layer to execute"
        type: choice
        required: true
        default: all
        options:
          - all
          - analytical
          - olap
      require_reader:
        description: "Require the aerogrid_reader role"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: wp-p3-analytics-evidence
  cancel-in-progress: false

jobs:
  verify:
    name: Run read-only analytics and capture evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: warehouse
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and runner dependencies
        run: >
          python -m pip install --disable-pip-version-check
          "pytest>=8,<10" "psycopg[binary]>=3.2,<4"

      - name: Run static tests
        run: python -m pytest -q Phase3/tests

      - name: Run read-only analytics
        env:
          READONLY_DATABASE_URL: ${{ secrets.READONLY_DATABASE_URL }}
          LAYER: ${{ inputs.layer }}
          REQUIRE_READER: ${{ inputs.require_reader }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          output="Phase3/evidence/analytics_run_${stamp}.md"
          args=(--layer "$LAYER" --output "$output")
          if [ "$REQUIRE_READER" = "true" ]; then
            args+=(--require-reader)
          fi
          python Phase3/scripts/run_readonly_analytics.py "${args[@]}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-p3-analytics-evidence-${{ github.run_id }}
          path: Phase3/evidence/analytics_run_*.md
          if-no-files-found: warn
          retention-days: 30
