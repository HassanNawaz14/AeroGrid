name: WP-04 staging DDL verify

on:
  workflow_dispatch:
    inputs:
      tartan_sample_path:
        description: "Optional path to a real Tartan KBTP CSV sample on the runner"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wp04-staging-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Apply WP-04 staging DDL (idempotent)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: warehouse
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >
          python -m pip install --disable-pip-version-check
          "psycopg[binary]>=3.2,<4" "pytest>=8,<10"

      - name: Run WP-04 unit tests
        run: python -m pytest -q Phase2/tests

      - name: Verify WP-04 staging DDL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARTAN_SAMPLE: ${{ inputs.tartan_sample_path }}
        run: |
          if [ -n "$TARTAN_SAMPLE" ]; then
            python Phase2/etl/verify_wp04_staging.py --tartan-sample "$TARTAN_SAMPLE"
          else
            python Phase2/etl/verify_wp04_staging.py
          fi
