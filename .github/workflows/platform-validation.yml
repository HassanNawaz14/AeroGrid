name: Platform validation (WP-02)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate warehouse and raw-bucket access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: warehouse
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: >
          python -m pip install --disable-pip-version-check
          "psycopg[binary]>=3.2,<4" "boto3>=1.35,<2"

      - name: Run platform probe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          READONLY_DATABASE_URL: ${{ secrets.READONLY_DATABASE_URL }}
          NEON_S3_ENDPOINT: ${{ secrets.NEON_S3_ENDPOINT }}
          NEON_S3_REGION: ${{ secrets.NEON_S3_REGION }}
          NEON_S3_BUCKET: ${{ secrets.NEON_S3_BUCKET }}
          NEON_S3_ACCESS_KEY_ID: ${{ secrets.NEON_S3_ACCESS_KEY_ID }}
          NEON_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_S3_SECRET_ACCESS_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/platform_probe.py --mode all
