name: WP-05 dimensions DDL verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp05-dimensions-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Apply WP-05 dimension DDL (idempotent)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: warehouse
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "psycopg[binary]>=3.2,<4" "pytest>=8,<10"

      - name: Run WP-05 unit tests
        run: python -m pytest -q Phase2/tests

      - name: Verify WP-05 dimension DDL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python Phase2/etl/verify_wp05_dimensions.py
